[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Set to "true" before selling to the public: the build then refuses any content
  # still `reviewed_by: null`. "false" while the site is a preview, so an unsigned-off
  # draft is testable rather than unbuildable. See docs/OPEN-DECISIONS.md #9.
  CONTENT_REQUIRE_REVIEW = "false"

[functions]
  node_bundler = "esbuild"

# The client only ever knows /api/*; which function serves it is not its business.
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/purchase-order"
  to = "/.netlify/functions/purchase-order"
  status = 200

[[redirects]]
  from = "/api/payment-webhook"
  to = "/.netlify/functions/payment-webhook"
  status = 200

# SPA fallback, last so it never swallows the API routes above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Pre-launch: unreviewed content must not reach a search index. Remove at launch.
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
